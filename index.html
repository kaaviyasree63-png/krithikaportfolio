<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vijay Pichandi | Presentation Specialist & PowerPoint Designer</title>
<meta name="description" content="Vijay Pichandi is a Presentation Specialist with 5+ years of experience designing corporate PowerPoint presentations, technical charts, infographics and templates.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#fdf4ff;--ink:#14091f;--mute:#6b6177;--p1:#8a1c9e;--p2:#5b2bb5;--soft:#e9d5f5;--card:#fff;--line:#ead7f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150b1d;--ink:#f6ecfb;--mute:#b6a8c2;--card:#21112d;--line:#3a2250;--soft:#3a2250}}
:root[data-theme="dark"]{--bg:#150b1d;--ink:#f6ecfb;--mute:#b6a8c2;--card:#21112d;--line:#3a2250;--soft:#3a2250}
html{scroll-padding-top:80px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--p2);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font-weight:700;font-size:20px}
.links{display:flex;gap:28px;font-size:14px;color:var(--mute)}
.links a:hover{color:var(--ink)}
.btn{display:inline-block;background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff;padding:11px 24px;border-radius:999px;font-weight:500;font-size:14px}
.btn.ghost{background:none;color:var(--p1);border:1.5px solid var(--p1)}
.hero{padding:56px 0 64px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
h1{font-size:clamp(34px,5vw,54px);line-height:1.12;margin:0 0 18px;font-weight:600}
.sub{color:var(--mute);max-width:46ch;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.orb{position:relative;width:min(380px,80vw);aspect-ratio:1;margin:0 auto;display:grid;place-items:center}
.orb:before{content:"";position:absolute;inset:0;border:2px dashed var(--p1);border-radius:50%}
.orb .disc{width:86%;aspect-ratio:1;border-radius:50%;background:linear-gradient(160deg,var(--p1),var(--p2));display:grid;place-items:center;overflow:hidden}
.orb img{width:94%;height:94%;border-radius:50%;object-fit:cover;display:block}
.tag{position:absolute;background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff;font-size:12px;padding:6px 16px;border-radius:999px}
.t1{right:-6px;top:58%}.t2{left:-10px;bottom:14%}.t3{left:6%;top:6%}
.band{background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff;padding:20px 0}
.band .wrap{display:flex;justify-content:space-around;flex-wrap:wrap;gap:12px 24px;font-weight:500}
section{padding:72px 0}
h2{font-size:clamp(26px,3.5vw,34px);margin:0 0 12px;font-weight:600}
.lead{color:var(--mute);max-width:62ch;margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.card h3{margin:0 0 8px;font-size:17px;font-weight:600}
.card p,.card li{color:var(--mute);font-size:14px;margin:0}
.card ul{padding-left:18px;margin:8px 0 0;display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px}
.purple{background:linear-gradient(180deg,var(--p1),#5a1275);color:#fff}
.purple .lead{color:#ecd9f5}
.purple .card{background:#fff;color:#14091f;border:0}
.purple .card p,.purple .card li{color:#6b6177}
.role{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;margin-bottom:6px}
.role b{font-size:17px}.role span{color:var(--p1);font-size:13px;font-weight:500}
.note{border:1.5px dashed var(--p1);border-radius:14px;padding:12px 16px;font-size:13px;color:var(--mute);margin-bottom:24px}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.steps .card:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff;font-weight:600;margin-bottom:12px}
.contact{display:grid;gap:12px;max-width:520px}
.contact a{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 20px;font-size:15px}
.contact small{display:block;color:var(--mute);font-size:12px}
footer{padding:28px 0;text-align:center;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}
@media(max-width:760px){.links{display:none}.hero .wrap{grid-template-columns:1fr}.orb{order:-1}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<nav><div class="wrap"><a class="logo" href="#top">Vijay Pichandi</a>
<div class="links"><a href="#about">About</a><a href="#experience">Experience</a><a href="#skills">Skills</a><a href="#services">Services</a><a
